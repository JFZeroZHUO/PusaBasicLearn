image: m.daocloud.io/docker.io/library/node:22-alpine

stages:
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - .next/
      - public/

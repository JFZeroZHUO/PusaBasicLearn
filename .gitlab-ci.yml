image: m.daocloud.io/docker.io/library/node:22-alpine

default:
  tags:
    - office

stages:
  - test
  - build
  - deploy

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  GIT_DEPTH: "1"
  GIT_LFS_SKIP_SMUDGE: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

build:
  stage: build
  script:
    - npm ci --include=optional --cache .npm --prefer-offline --progress=false
    - npm run build
  artifacts:
    name: "build-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    when: on_success
    paths:
      - .next/static/
      - public/legacy/index.html
      - public/legacy/assets/*.js
      - public/legacy/assets/*.css

test:
  stage: test
  script:
    - npm ci --include=optional --cache .npm --prefer-offline --progress=false
    - npx tsc --noEmit

deploy:
  stage: deploy
  tags:
    - office
  needs:
    - build
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  allow_failure: true
  script:
    - echo "Deploy job is ready. Set DEPLOY_COMMAND in CI variables to run real deploy."
    - if [ -n "$DEPLOY_COMMAND" ]; then sh -lc "$DEPLOY_COMMAND"; else echo "No DEPLOY_COMMAND configured, skip deploy."; fi
